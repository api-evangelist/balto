apis:
- name: Balto Call Data API
  description: >-
    Balto's Call Data API gives customers programmatic access to their historical
    call records so they can transfer, analyse and activate that data in a CRM,
    data warehouse or any system that accepts API-based ingestion, without needing
    a native CCaaS integration. Balto runs it as a separately monitored production
    service — "Balto Data API" is its own component on status.balto.ai. The
    reference documentation is inside the customer-only Docs Hub, so the base URL,
    authentication model, operations and limits are not published publicly and no
    baseURL is recorded here rather than guessed.
  humanURL: https://www.balto.ai/integrations/call-data-api/
  x-base-url: undisclosed
  x-base-url-reason: >-
    API reference is gated behind login.balto.ai; no api.* host resolves in DNS and
    none appears in certificate transparency for balto.ai (checked 2026-08-14).
