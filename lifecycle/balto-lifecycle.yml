  "Balto Data API" is a first-class, separately-monitored component on Balto's own
  status page — independent confirmation that Balto operates a production API
  product, even though its contract and base URL are not published publicly.
  Observed 2026-08-14 via the Statuspage components API.
versioning:
  scheme: unknown
  current: null
  docs: null
  notes: >-
    Balto operates a public-facing API product (the Call Data API, plus softphone
    and CCaaS integration APIs) documented in the Docs Hub at docs.balto.ai. That
    hub is ReadMe-hosted and HTTP 302s every path — including /reference and
    /openapi.json — to https://login.balto.ai/. Balto states on
    https://www.balto.ai/download-balto/ that the Docs Hub, which contains "Full
    API Documentation", "is available exclusively to current customers with Balto
    Cloud login credentials". No versioning scheme, version header, or version
    path segment is therefore verifiable from outside the customer login.
