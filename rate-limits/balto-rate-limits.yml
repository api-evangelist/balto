description: >-
  No rate limits are published on Balto's public surface. Balto's full API
  documentation lives in the Docs Hub at docs.balto.ai, which is a ReadMe-hosted
  site that HTTP 302s EVERY path — including /reference and /openapi.json — to
  https://login.balto.ai/?redirect=... Balto states plainly on
  https://www.balto.ai/download-balto/ that "The Docs Hub is available
  exclusively to current customers with Balto Cloud login credentials" and that
  it is where "Full API Documentation" sits. The public Call Data API product
  page carries no limits, no headers, and no throttling status code. Nothing was
  observed on a live unauthenticated response because there is no reachable
  unauthenticated Balto API endpoint to observe. This is an honest zero, not an
  absence of limits — limits very likely exist behind the customer login.
