description: >-
  Balto publishes NO pricing page and NO plan tiers. https://www.balto.ai/pricing
  and /pricing/ both return HTTP 404, and the site navigation carries no pricing
  entry — every commercial call-to-action across balto.ai routes to "Book a Demo"
  (https://www.balto.ai/get-demo/) or hello@balto.ai. Balto is sold as a custom
  enterprise contract quoted on seat count and term; no self-serve plan, no
  published list price, and no per-seat rate card exists on the provider's own
  surface. The Call Data API is a capability of that contract rather than a
  separately priced product, so there is no API price list either.
